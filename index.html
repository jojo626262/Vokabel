<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Vokabeln">
<meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161513" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Vokabeln</title>
<style>
:root{
  --bg:#f6f4ef; --card:#fffdf9; --raised:#efece5;
  --text:#1f1d1a; --text2:#5c5850; --text3:#6b665e;
  --line:rgba(31,29,26,.10);
  --accent:#1b7f73; --accent-hover:#17695f; --accent-t:#0f6b61;
  --pos:#15803d; --neg:#dc2626; --pos-fill:#15803d; --neg-fill:#cc2f2f;
  --shadow:0 1px 2px rgba(31,29,26,.05);
  --ease:cubic-bezier(0.22,1,0.36,1);
  --serif:ui-serif,"New York",Georgia,"Times New Roman",serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#161513; --card:#1c1a18; --raised:#26231f;
    --text:#efe9de; --text2:#a8a196; --text3:#8a8479;
    --line:rgba(239,233,222,.10);
    --accent-t:#5cc2b3; --pos:#4cc38a; --neg:#ee5d61; --shadow:none;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font:16px/24px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-variant-numeric:tabular-nums;padding-bottom:calc(env(safe-area-inset-bottom) + 24px)}
svg{flex:none}
:focus-visible{outline:2px solid var(--accent-t);outline-offset:2px}

.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 8px) 12px 8px}
.bar-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:8px;min-height:44px}
.bar h1{flex:1;margin:0;font-size:17px;line-height:24px;font-weight:500;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .side{min-width:88px;display:flex}
.bar .side.r{justify-content:flex-end}
.link{font:inherit;font-weight:500;color:var(--accent-t);background:none;border:0;padding:8px 4px;min-height:44px;cursor:pointer;
  display:inline-flex;align-items:center;gap:4px;border-radius:8px;transition:opacity 150ms var(--ease)}
.link:active{opacity:.6}

.pad{max-width:560px;margin:0 auto;padding:16px}
h2{font-size:13px;line-height:20px;font-weight:500;margin:0 0 8px;color:var(--text3)}
h3{margin:0 0 12px;font-size:20px;line-height:28px;font-weight:500}
p{margin:0 0 8px}
.muted{color:var(--text3)} .small{font-size:13px;line-height:20px}
.row{display:flex;align-items:center;gap:8px}

.card{background:var(--card);border-radius:12px;padding:16px;margin-bottom:12px;border:1px solid var(--line);box-shadow:var(--shadow)}
.warncard{border-color:var(--accent)}
.rowbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:inherit;
  background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:8px;cursor:pointer;min-height:56px;
  box-shadow:var(--shadow);transition:background-color 150ms var(--ease),transform 120ms var(--ease)}
.rowbtn:active{transform:scale(.98)}
.rowbtn .main{flex:1;min-width:0}
.rowbtn .t{font-weight:500;overflow:hidden;text-overflow:ellipsis}
.rowbtn .s{color:var(--text3);font-size:13px;line-height:20px}
.count,.status{font:12px/16px var(--mono);color:var(--text3);white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.count.due,.status.due{color:var(--accent-t)}
.num{font:12px/16px var(--mono);opacity:.8;margin-left:4px}

.btn{font:inherit;font-weight:500;border-radius:10px;padding:12px 16px;min-height:48px;background:var(--card);color:var(--accent-t);
  border:1px solid var(--line);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  transition:background-color 150ms var(--ease),border-color 150ms var(--ease),color 150ms var(--ease),opacity 150ms var(--ease),transform 120ms var(--ease)}
.btn:active:not([disabled]){transform:scale(.98)}
.btn.primary{background:var(--accent);color:#fff;border-color:transparent}
.btn.ok{background:var(--pos-fill);color:#fff;border-color:transparent}
.btn.bad{background:var(--neg-fill);color:#fff;border-color:transparent}
.btn.danger{color:var(--neg)}
.btn.wide{display:flex;width:100%;margin-top:8px}
.btn[disabled]{opacity:.45;cursor:default}

.seg{display:flex;background:var(--raised);border-radius:10px;padding:4px;margin:8px 0;gap:4px}
.seg button{flex:1;font:inherit;font-size:13px;line-height:20px;font-weight:500;border:1px solid transparent;background:transparent;color:var(--text2);
  padding:8px 4px;border-radius:8px;cursor:pointer;transition:background-color 150ms var(--ease),color 150ms var(--ease),border-color 150ms var(--ease)}
.seg button.on{background:var(--card);color:var(--text);border-color:var(--line);box-shadow:var(--shadow)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{font:inherit;font-size:14px;line-height:20px;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text2);
  cursor:pointer;display:inline-flex;align-items:center;gap:4px;
  transition:background-color 150ms var(--ease),color 150ms var(--ease),border-color 150ms var(--ease),transform 120ms var(--ease)}
.chip:active{transform:scale(.97)}
.chip.on{background:var(--accent);border-color:transparent;color:#fff}

.empty{text-align:center;padding:40px 16px;color:var(--text3)}
.empty h3{color:var(--text)}
input[type=text],input[type=search]{width:100%;font:inherit;font-size:16px;padding:12px;margin:8px 0;border-radius:10px;
  border:1px solid var(--line);background:var(--bg);color:var(--text);transition:border-color 150ms var(--ease)}
input:focus{border-color:var(--accent)}

.progress{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin:8px 0}
.progress .fill{height:100%;width:100%;background:var(--accent);transform-origin:left center}
.flash{position:relative;min-height:40vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;
  padding:24px;border-radius:16px;background:var(--card);border:1px solid var(--line);margin:16px 0 24px;cursor:pointer;user-select:none;-webkit-user-select:none;
  box-shadow:var(--shadow)}
.flash.stack{box-shadow:0 7px 0 -3px var(--card),0 8px 0 -3px var(--line)}
.flash .cat{position:absolute;top:12px;left:12px;max-width:75%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  background:var(--raised);color:var(--text3);font-size:12px;line-height:16px;padding:4px 8px;border-radius:6px}
.flash .front{font-family:var(--serif);font-size:36px;line-height:44px;font-weight:500;overflow-wrap:anywhere}
.flash .back{font-family:var(--serif);font-size:28px;line-height:36px;color:var(--accent-t);margin-top:20px;padding-top:20px;
  border-top:1px solid var(--line);width:100%;overflow-wrap:anywhere}
.flash .hint{color:var(--text3);font-size:13px;line-height:20px;margin-top:20px}
.two{display:flex;gap:12px}.two .btn{flex:1}
.stat{display:flex;justify-content:center;gap:32px;font-size:24px;line-height:32px;margin:12px 0 8px}
.stat span{display:inline-flex;align-items:center;gap:8px}
.ok-t{color:var(--pos)}.bad-t{color:var(--neg)}
p.ok-t{display:flex;align-items:center;gap:8px}
.big{font-family:var(--serif);font-size:32px;line-height:40px;font-weight:500;margin:8px 0 12px;overflow-wrap:anywhere}

.overlay{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.4);display:flex;align-items:flex-start;justify-content:center;overflow:auto;
  animation:fade 160ms var(--ease) backwards}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:16px;margin:calc(env(safe-area-inset-top) + 12px) 12px 12px;padding:16px;
  border:1px solid var(--line);animation:rise 240ms var(--ease) backwards}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.actions .btn{flex:1;min-width:112px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);z-index:30;
  background:#2a2825;color:#efe9de;padding:12px 16px;border-radius:10px;font-size:14px;line-height:20px;max-width:90%;text-align:center;
  animation:fade 160ms var(--ease) backwards}

@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes grow{from{transform:scaleX(var(--from))}to{transform:scaleX(var(--to))}}
.enter .rowbtn,.enter .card,.enter .empty,.enter .pad>.btn{animation:rise 360ms var(--ease) backwards;animation-delay:calc(var(--i,0)*40ms)}
.flash.fresh{animation:rise 240ms var(--ease) backwards}
.flash .back{animation:rise 240ms var(--ease) backwards}
.progress .fill.grow{animation:grow 400ms var(--ease) backwards}

@media (hover:hover){
  .rowbtn:hover{background:var(--raised)}
  .btn:hover:not([disabled]){background:var(--raised)}
  .btn.primary:hover:not([disabled]){background:var(--accent-hover)}
  .btn.ok:hover:not([disabled]),.btn.bad:hover:not([disabled]){filter:brightness(.94)}
  .chip:hover:not(.on){background:var(--raised)}
  .chip.on:hover{background:var(--accent-hover)}
  .seg button:not(.on):hover{color:var(--text)}
  .link:hover{opacity:.75}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
(() => {
'use strict';

/* ============ Daten ============ */
const KEY = 'vokabeln.v1', SNAP = 'vokabeln.snapshot.v1';
const LIMIT = 30, WEEK = 7 * 864e5, DAY = 864e5;
const $app = document.getElementById('app');

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const emptyDb = () => ({ v: 1, folders: [], categories: [], words: [], meta: { lastBackup: 0, direction: 'fwd' } });
const fixWord = w => Object.assign({ reps: 0, ef: 2.5, interval: 0, due: 0, correct: 0, wrong: 0, last: 0, created: Date.now() }, w);

function normalize(d) {
  const e = emptyDb();
  if (!d || typeof d !== 'object') return e;
  const folders = Array.isArray(d.folders) ? d.folders.filter(f => f && f.id && typeof f.name === 'string') : [];
  const fids = new Set(folders.map(f => f.id));
  const categories = (Array.isArray(d.categories) ? d.categories : [])
    .filter(c => c && c.id && fids.has(c.folderId) && typeof c.name === 'string');
  const cids = new Set(categories.map(c => c.id));
  const words = (Array.isArray(d.words) ? d.words : [])
    .filter(w => w && w.id && cids.has(w.categoryId) && typeof w.foreign === 'string' && typeof w.native === 'string')
    .map(fixWord);
  const meta = Object.assign(e.meta, d.meta && typeof d.meta === 'object' ? d.meta : {});
  return { v: 1, folders, categories, words, meta };
}
function load() {
  try { const s = localStorage.getItem(KEY); if (s) return normalize(JSON.parse(s)); } catch (e) { /* leer */ }
  return emptyDb();
}
let db = load();
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); }
  catch (e) { toast('Speichern fehlgeschlagen – Speicher voll?'); }
}
function saveSnapshot() {
  try { localStorage.setItem(SNAP, JSON.stringify({ t: Date.now(), data: db })); } catch (e) { /* egal */ }
}
function readSnapshot() {
  try { const s = JSON.parse(localStorage.getItem(SNAP)); return s && s.data ? s : null; } catch (e) { return null; }
}

const catsOf = fid => db.categories.filter(c => c.folderId === fid);
const wordsOfCat = cid => db.words.filter(w => w.categoryId === cid);
const wordsOfFolder = fid => { const ids = new Set(catsOf(fid).map(c => c.id)); return db.words.filter(w => ids.has(w.categoryId)); };
const dueOf = list => list.filter(w => w.due <= Date.now());
const sday = t => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
const pl = (n, s, p) => n + ' ' + (n === 1 ? s : p);
const fmtDate = t => new Date(t).toLocaleString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

function statusText(w) {
  if (!w.last) return 'neu';
  if (w.due <= Date.now()) return 'fällig';
  const days = Math.round((sday(w.due) - sday(Date.now())) / DAY);
  return days <= 1 ? 'morgen' : 'in ' + days + ' Tagen';
}

/* Lernplan (SM-2) */
function review(w, ok) {
  const now = Date.now();
  if (ok) {
    w.interval = w.reps === 0 ? 1 : w.reps === 1 ? 6 : Math.max(1, Math.round(w.interval * w.ef));
    w.reps++; w.correct++;
    const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() + w.interval);
    w.due = d.getTime();
  } else {
    w.reps = 0; w.interval = 0; w.wrong++; w.due = now;
  }
  const x = 5 - (ok ? 4 : 2);
  w.ef = Math.max(1.3, w.ef + (0.1 - x * (0.08 + x * 0.02)));
  w.last = now;
}

/* ============ DOM-Helfer ============ */
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const k in (attrs || {})) {
    const v = attrs[k];
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(Infinity)) {
    if (c == null || c === false) continue;
    e.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return e;
}
const btn = (text, onclick, cls = '', disabled = false) => h('button', { class: 'btn ' + cls, onclick, disabled, type: 'button' }, text);
const empty = (t, s) => h('div', { class: 'empty' }, h('h3', {}, t), h('p', {}, s));

const SVGNS = 'http://www.w3.org/2000/svg';
const ICONS = { check: 'M20 6 9 17l-5-5', x: 'M18 6 6 18M6 6l12 12', left: 'm15 18-6-6 6-6', plus: 'M5 12h14M12 5v14' };
function icon(name, size = 16) {
  const svg = document.createElementNS(SVGNS, 'svg');
  const set = (k, v) => svg.setAttribute(k, v);
  set('viewBox', '0 0 24 24'); set('width', size); set('height', size); set('fill', 'none'); set('stroke', 'currentColor');
  set('stroke-width', '1.5'); set('stroke-linecap', 'round'); set('stroke-linejoin', 'round'); set('aria-hidden', 'true');
  const p = document.createElementNS(SVGNS, 'path'); p.setAttribute('d', ICONS[name]); svg.append(p);
  return svg;
}
const dueBadge = n => n ? h('span', { class: 'count due' }, n + ' fällig') : h('span', { class: 'count' }, icon('check', 14));

let toastTimer;
function toast(msg) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = h('div', { class: 'toast' }, msg);
  document.body.append(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.remove(), 2400);
}

function openModal(build) {
  const back = h('div', { class: 'overlay' });
  const close = () => back.remove();
  back.addEventListener('click', e => { if (e.target === back) close(); });
  const box = h('div', { class: 'sheet', role: 'dialog' });
  box.append(build(close));
  back.append(box);
  document.body.append(back);
  const first = box.querySelector('input');
  if (first) setTimeout(() => first.focus(), 60);
}

function askName(title, value, okText, onOk, extra) {
  openModal(close => {
    const input = h('input', { type: 'text', value: value || '', placeholder: 'Name', maxlength: '60', autocapitalize: 'sentences' });
    const submit = () => { const t = input.value.trim(); if (!t) { input.focus(); return; } close(); onOk(t); };
    input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
    return h('div', {}, h('h3', {}, title), input,
      h('div', { class: 'actions' }, extra ? extra(close) : null, btn('Abbrechen', close), btn(okText, submit, 'primary')));
  });
}

/* ============ Navigation ============ */
let view = { name: 'home' };
const stack = [];
history.replaceState({ i: 0 }, '');

function go(v) {
  stack.push(view); view = v;
  history.pushState({ i: stack.length }, '');
  render(false);
}
function exit() {
  if (stack.length) history.back();
  else { view = { name: 'home' }; render(false); }
}
window.addEventListener('popstate', e => {
  const i = e.state && typeof e.state.i === 'number' ? e.state.i : 0;
  if (i < stack.length) { while (stack.length > i) view = stack.pop(); render(false); }
});
function resetNav() { stack.length = 0; view = { name: 'home' }; render(false); }

function header(title, left, right) {
  return h('div', { class: 'bar' }, h('div', { class: 'bar-in' },
    h('div', { class: 'side' }, left === undefined ? (stack.length ? h('button', { class: 'link', onclick: exit }, icon('left', 18), 'Zurück') : null) : left),
    h('h1', {}, title),
    h('div', { class: 'side r' }, right || null)));
}
const gone = () => { setTimeout(exit, 0); return h('div'); };

/* ============ Backup / Dateien ============ */
async function shareOrDownload(name, text, mime) {
  try {
    const file = new File([text], name, { type: mime });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: name });
      return true;
    }
  } catch (e) {
    if (e && e.name === 'AbortError') return false;
  }
  const url = URL.createObjectURL(new Blob([text], { type: mime }));
  const a = h('a', { href: url, download: name });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
  return true;
}
async function doBackup() {
  const stamp = new Date().toISOString().slice(0, 10);
  const ok = await shareOrDownload('vokabeln-backup-' + stamp + '.json', JSON.stringify(db), 'application/json');
  if (ok) { db.meta.lastBackup = Date.now(); save(); toast('Backup gespeichert'); render(); }
}
function pickFile(accept, onFile) {
  const inp = h('input', { type: 'file', accept, style: 'display:none' });
  inp.addEventListener('change', () => { const f = inp.files && inp.files[0]; inp.remove(); if (f) onFile(f); });
  document.body.append(inp); inp.click();
}
async function readText(file) {
  const buf = await file.arrayBuffer();
  try { return new TextDecoder('utf-8', { fatal: true }).decode(buf); }
  catch (e) { return new TextDecoder('windows-1252').decode(buf); }
}

/* CSV */
function csvEscape(s) { return /[;"\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
function csvExport(words) {
  return ['Fremdsprache;Deutsch'].concat(words.map(w => csvEscape(w.foreign) + ';' + csvEscape(w.native))).join('\n');
}
function csvParse(text) {
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const first = text.split(/\r\n|\n|\r/)[0] || '';
  const delim = first.includes(';') ? ';' : first.includes('\t') ? '\t' : ',';
  const rows = []; let row = [], field = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else q = false; }
      else field += c;
    } else if (c === '"') q = true;
    else if (c === delim) { row.push(field); field = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(field); field = ''; rows.push(row); row = [];
    } else field += c;
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  return rows;
}
function csvExportFolder(f) {
  const lines = ['Fremdsprache;Deutsch;Kategorie'];
  catsOf(f.id).forEach(c => wordsOfCat(c.id).forEach(w => lines.push([w.foreign, w.native, c.name].map(csvEscape).join(';'))));
  return lines.join('\n');
}
/* opts.cat: alles in diese Kategorie. opts.folder: Kategorien aus der 3. Spalte anlegen. */
function importCsv(opts) {
  pickFile('.csv,.txt,text/csv,text/plain', async file => {
    const rows = csvParse(await readText(file));
    const folderId = opts.cat ? opts.cat.folderId : opts.folder.id;
    const byName = new Map(catsOf(folderId).map(c => [c.name.toLowerCase(), c]));
    const created = new Set();
    const catFor = name => {
      if (opts.cat) return opts.cat;
      const k = name.toLowerCase();
      let c = byName.get(k);
      if (!c) { c = { id: uid(), folderId, name }; db.categories.push(c); byName.set(k, c); created.add(c.id); }
      return c;
    };
    const key = (cid, a, b) => cid + '\u001f' + a.toLowerCase() + '\u001f' + b.toLowerCase();
    const have = new Set(wordsOfFolder(folderId).map(w => key(w.categoryId, w.foreign, w.native)));
    let added = 0, skipped = 0;
    rows.forEach((r, idx) => {
      const c = r.map(x => x.trim());
      if (c.every(x => !x)) return;
      if (idx === 0 && (['fremdsprache', 'vorderseite'].includes((c[0] || '').toLowerCase()) || (c[1] || '').toLowerCase() === 'deutsch')) return;
      if (c.length < 2 || !c[0] || !c[1]) { skipped++; return; }
      const cat = catFor(c[2] || 'Ohne Kategorie');
      const k = key(cat.id, c[0], c[1]);
      if (have.has(k)) { skipped++; return; }
      have.add(k);
      db.words.push(fixWord({ id: uid(), categoryId: cat.id, foreign: c[0], native: c[1] }));
      added++;
    });
    save(); render();
    toast(added + ' importiert, ' + skipped + ' übersprungen' + (created.size ? ' · ' + pl(created.size, 'neue Kategorie', 'neue Kategorien') : ''));
  });
}

/* ============ Ansichten ============ */
function backupBanner() {
  if (!db.words.length) return null;
  const last = db.meta.lastBackup;
  if (last && Date.now() - last < WEEK) return null;
  const days = last ? Math.floor((Date.now() - last) / DAY) : 0;
  return h('div', { class: 'card warncard' },
    h('p', {}, last ? 'Letztes Backup: vor ' + pl(days, 'Tag', 'Tagen') : 'Noch kein Backup gespeichert.'),
    btn('Jetzt sichern', doBackup, 'primary wide'));
}

function viewHome() {
  const rows = db.folders.map(f => {
    const ws = wordsOfFolder(f.id), due = dueOf(ws).length;
    return h('button', { class: 'rowbtn', onclick: () => go({ name: 'folder', id: f.id }) },
      h('div', { class: 'main' }, h('div', { class: 't' }, f.name),
        h('div', { class: 's' }, pl(catsOf(f.id).length, 'Kategorie', 'Kategorien') + ' · ' + pl(ws.length, 'Wort', 'Wörter'))),
      dueBadge(due));
  });
  return h('div', {},
    header('Vokabeln', null, h('button', { class: 'link', onclick: () => go({ name: 'settings' }) }, 'Mehr')),
    h('div', { class: 'pad' }, backupBanner(),
      rows.length ? rows : empty('Noch kein Ordner', 'Lege pro Sprache einen Ordner an, z. B. „Englisch“. Darin legst du Kategorien an.'),
      btn([icon('plus'), 'Neuer Ordner (Sprache)'], addFolder, 'primary wide')));
}
function addFolder() {
  askName('Neuer Ordner (Sprache)', '', 'Anlegen', name => { db.folders.push({ id: uid(), name }); save(); render(); });
}

function dirSeg() {
  const dir = db.meta.direction;
  return h('div', { class: 'seg' }, [['fwd', 'Fremd → Deutsch'], ['rev', 'Deutsch → Fremd'], ['mix', 'Gemischt']]
    .map(([k, t]) => h('button', { class: k === dir ? 'on' : '', type: 'button', onclick: () => { db.meta.direction = k; save(); render(); } }, t)));
}
function practiceBox(pool, cats) {
  const due = dueOf(pool);
  return h('div', { class: 'card' }, h('h2', {}, 'Üben'),
    h('p', {}, due.length + ' fällig · ' + pl(pool.length, 'Wort', 'Wörter')), dirSeg(),
    btn('Fällige üben (' + Math.min(due.length, LIMIT) + ')', () => startPractice(due, cats), 'primary wide', due.length === 0),
    btn('Zufällig aus allen', () => startPractice(pool, cats), 'wide', pool.length === 0));
}
function folderPractice(f, v) {
  const cats = catsOf(f.id).filter(c => wordsOfCat(c.id).length);
  if (!v.off) v.off = new Set();
  const sel = cats.filter(c => !v.off.has(c.id));
  const pool = sel.flatMap(c => wordsOfCat(c.id)), due = dueOf(pool);
  const chips = cats.map(c => {
    const on = !v.off.has(c.id), d = dueOf(wordsOfCat(c.id)).length;
    return h('button', { class: 'chip' + (on ? ' on' : ''), type: 'button',
      onclick: () => { if (on) v.off.add(c.id); else v.off.delete(c.id); render(); } },
      on ? icon('check', 14) : null, c.name, d ? h('span', { class: 'num' }, d) : null);
  });
  const all = sel.length === cats.length;
  return h('div', { class: 'card' }, h('h2', {}, 'Üben'),
    h('p', { class: 'small muted' }, 'Kategorien auswählen (Zahl = fällig)'),
    h('div', { class: 'chips' }, chips),
    h('button', { class: 'link', type: 'button', onclick: () => { if (all) cats.forEach(c => v.off.add(c.id)); else v.off.clear(); render(); } }, all ? 'Keine auswählen' : 'Alle auswählen'),
    h('p', {}, due.length + ' fällig · ' + pl(pool.length, 'Wort', 'Wörter') + ' in ' + pl(sel.length, 'Kategorie', 'Kategorien')),
    dirSeg(),
    btn('Fällige üben (' + Math.min(due.length, LIMIT) + ')', () => startPractice(due, sel), 'primary wide', due.length === 0),
    btn('Zufällige Kategorie', () => startRandom(sel), 'wide', sel.length === 0),
    btn('Frei üben (zufällig)', () => startPractice(pool, sel), 'wide', pool.length === 0));
}
function folderData(f) {
  const n = wordsOfFolder(f.id).length;
  return h('div', { class: 'card' }, h('h2', {}, 'Daten dieses Ordners'),
    h('p', { class: 'muted small' }, 'CSV mit den Spalten Fremdsprache, Deutsch, Kategorie. Beim Import werden die Kategorien aus der dritten Spalte automatisch angelegt.'),
    btn('CSV importieren (mit Kategorien)', () => importCsv({ folder: f }), 'primary wide'),
    btn('CSV exportieren', async () => {
      const ok = await shareOrDownload((f.name.replace(/[^\w\-äöüÄÖÜß ]+/g, '_') || 'ordner') + '.csv', csvExportFolder(f), 'text/csv');
      if (ok) toast('CSV exportiert');
    }, 'wide', n === 0));
}

function viewFolder(v) {
  const f = db.folders.find(x => x.id === v.id);
  if (!f) return gone();
  const cats = catsOf(f.id);
  const rows = cats.map(c => {
    const ws = wordsOfCat(c.id), due = dueOf(ws).length;
    return h('button', { class: 'rowbtn', onclick: () => go({ name: 'category', id: c.id }) },
      h('div', { class: 'main' }, h('div', { class: 't' }, c.name), h('div', { class: 's' }, pl(ws.length, 'Wort', 'Wörter'))),
      dueBadge(due));
  });
  const edit = h('button', { class: 'link', onclick: () => askName('Ordner umbenennen', f.name, 'Speichern',
    name => { f.name = name; save(); render(); },
    close => btn('Löschen', () => { close(); deleteFolder(f); }, 'danger')) }, 'Bearbeiten');
  return h('div', {},
    header(f.name, undefined, edit),
    h('div', { class: 'pad' },
      cats.length ? folderPractice(f, v) : null,
      h('h2', {}, 'Kategorien'),
      rows.length ? rows : empty('Noch keine Kategorie', 'Lege eine Kategorie an, z. B. „Lektion 1“ oder „Essen“.'),
      btn([icon('plus'), 'Neue Kategorie'], () => askName('Neue Kategorie', '', 'Anlegen',
        name => { db.categories.push({ id: uid(), folderId: f.id, name }); save(); render(); }), 'wide'),
      folderData(f)));
}
function deleteFolder(f) {
  const n = wordsOfFolder(f.id).length;
  if (!confirm('Ordner „' + f.name + '“ mit ' + pl(catsOf(f.id).length, 'Kategorie', 'Kategorien') + ' und ' + pl(n, 'Wort', 'Wörtern') + ' wirklich löschen?')) return;
  saveSnapshot();
  const cids = new Set(catsOf(f.id).map(c => c.id));
  db.words = db.words.filter(w => !cids.has(w.categoryId));
  db.categories = db.categories.filter(c => c.folderId !== f.id);
  db.folders = db.folders.filter(x => x.id !== f.id);
  save(); toast('Gelöscht (Auto-Sicherung unter „Mehr“)'); exit();
}

function viewCategory(v) {
  const c = db.categories.find(x => x.id === v.id);
  if (!c) return gone();
  const all = wordsOfCat(c.id).sort((a, b) => a.foreign.localeCompare(b.foreign, 'de'));
  const list = h('div', {});
  const paint = () => {
    const q = (v.q || '').trim().toLowerCase();
    const ws = q ? all.filter(w => w.foreign.toLowerCase().includes(q) || w.native.toLowerCase().includes(q)) : all;
    list.replaceChildren(...(ws.length ? ws.map(w => h('button', { class: 'rowbtn', onclick: () => wordForm(c, w) },
      h('div', { class: 'main' }, h('div', { class: 't' }, w.foreign), h('div', { class: 's' }, w.native)),
      h('span', { class: 'status' + (statusText(w) === 'fällig' ? ' due' : '') }, statusText(w))))
      : [empty(all.length ? 'Nichts gefunden' : 'Noch keine Wörter', all.length ? 'Anderer Suchbegriff?' : 'Tippe auf „Wort hinzufügen“.')]));
  };
  paint();
  const search = all.length > 8 ? h('input', { type: 'search', placeholder: 'Suchen', value: v.q || '',
    oninput: e => { v.q = e.target.value; paint(); } }) : null;
  const edit = h('button', { class: 'link', onclick: () => askName('Kategorie umbenennen', c.name, 'Speichern',
    name => { c.name = name; save(); render(); },
    close => btn('Löschen', () => {
      close();
      if (!confirm('Kategorie „' + c.name + '“ mit ' + pl(all.length, 'Wort', 'Wörtern') + ' wirklich löschen?')) return;
      saveSnapshot();
      db.words = db.words.filter(w => w.categoryId !== c.id);
      db.categories = db.categories.filter(x => x.id !== c.id);
      save(); toast('Gelöscht (Auto-Sicherung unter „Mehr“)'); exit();
    }, 'danger')) }, 'Bearbeiten');
  return h('div', {},
    header(c.name, undefined, edit),
    h('div', { class: 'pad' },
      all.length ? practiceBox(all, [c]) : null,
      h('h2', {}, pl(all.length, 'Wort', 'Wörter')),
      btn([icon('plus'), 'Wort hinzufügen'], () => wordForm(c, null), 'primary'),
      h('div', { style: 'height:12px' }), search, list,
      h('div', { class: 'card' }, h('h2', {}, 'Daten dieser Kategorie'),
        h('p', { class: 'muted small' }, 'CSV enthält nur die Wörter (ohne Lernstand). Den kompletten Stand sicherst du mit dem Backup unter „Mehr“.'),
        btn('CSV exportieren', async () => {
          const ok = await shareOrDownload((c.name.replace(/[^\w\-äöüÄÖÜß ]+/g, '_') || 'kategorie') + '.csv', csvExport(all), 'text/csv');
          if (ok) toast('CSV exportiert');
        }, 'wide', all.length === 0),
        btn('CSV importieren', () => importCsv({ cat: c }), 'wide'))));
}

function wordForm(cat, word) {
  openModal(close => {
    const f = h('input', { type: 'text', value: word ? word.foreign : '', placeholder: 'Fremdsprache, z. B. house', autocapitalize: 'off', autocorrect: 'off', spellcheck: 'false' });
    const n = h('input', { type: 'text', value: word ? word.native : '', placeholder: 'Deutsch, z. B. das Haus', autocorrect: 'off' });
    const info = h('p', { class: 'muted small' }, '');
    let added = 0;
    const commit = () => {
      const ff = f.value.trim(), nn = n.value.trim();
      if (!ff || !nn) { (ff ? n : f).focus(); return false; }
      const dup = wordsOfCat(cat.id).some(w => w.foreign.toLowerCase() === ff.toLowerCase() && (!word || w.id !== word.id));
      if (dup && !confirm('„' + ff + '“ gibt es in dieser Kategorie schon. Trotzdem speichern?')) return false;
      if (word) { word.foreign = ff; word.native = nn; }
      else { db.words.push(fixWord({ id: uid(), categoryId: cat.id, foreign: ff, native: nn })); added++; }
      save(); return true;
    };
    const next = () => {
      if (!commit()) return;
      if (word) { close(); render(); }
      else { f.value = ''; n.value = ''; f.focus(); info.textContent = pl(added, 'Wort', 'Wörter') + ' gespeichert'; render(); }
    };
    n.addEventListener('keydown', e => { if (e.key === 'Enter') next(); });
    f.addEventListener('keydown', e => { if (e.key === 'Enter') n.focus(); });
    const done = () => {
      if (!word && (f.value.trim() || n.value.trim())) { if (!commit()) return; }
      close(); render();
    };
    const actions = word
      ? [btn('Abbrechen', close), btn('Löschen', () => {
          if (confirm('„' + word.foreign + '“ löschen?')) { db.words = db.words.filter(w => w.id !== word.id); save(); close(); render(); }
        }, 'danger'), btn('Speichern', next, 'primary')]
      : [btn('Fertig', done), btn('Speichern & weiter', next, 'primary')];
    return h('div', {}, h('h3', {}, word ? 'Wort bearbeiten' : 'Neues Wort'), f, n, info, h('div', { class: 'actions' }, actions));
  });
}

/* ---- Üben (Karteikarten) ---- */
function pickRev() { const d = db.meta.direction; return d === 'rev' ? true : d === 'mix' ? Math.random() < 0.5 : false; }
const DIR_LABEL = { fwd: 'Fremd → Deutsch', rev: 'Deutsch → Fremd', mix: 'Gemischt' };
function catsTitle(cats) {
  if (cats.length === 1) return cats[0].name;
  if (cats.length <= 3) return cats.map(c => c.name).join(', ');
  return cats.length + ' Kategorien';
}
function makeSession(list, cats, note) {
  const queue = shuffle(list.slice()).slice(0, LIMIT);
  return { queue, total: queue.length, due: dueOf(queue).length, done: 0, correct: 0, wrong: 0, retried: new Set(),
    revealed: false, reversed: pickRev(), finished: false, t0: Date.now(), intro: true,
    title: catsTitle(cats), note: note || '', catId: cats.length === 1 ? cats[0].id : null };
}
function startPractice(list, cats, note, reroll) {
  if (!list.length) return;
  go({ name: 'practice', s: makeSession(list, cats, note), reroll });
}
/* Zufällige Kategorie: bevorzugt eine mit fälligen Wörtern, sonst frei aus allen gewählten. */
function randomSession(sel, excludeId) {
  let opts = sel.filter(c => wordsOfCat(c.id).length);
  const withDue = opts.filter(c => dueOf(wordsOfCat(c.id)).length);
  if (withDue.length) opts = withDue;
  if (opts.length > 1 && excludeId) opts = opts.filter(c => c.id !== excludeId);
  const c = opts[Math.floor(Math.random() * opts.length)];
  const ws = wordsOfCat(c.id), due = dueOf(ws);
  return makeSession(due.length ? due : ws, [c], 'Zufällig ausgewählt');
}
function startRandom(sel) {
  if (!sel.length) return;
  go({ name: 'practice', s: randomSession(sel), reroll: ex => randomSession(sel, ex) });
}
function answer(s, ok) {
  const w = s.queue.shift();
  if (!s.retried.has(w.id)) { review(w, ok); ok ? s.correct++ : s.wrong++; save(); }
  if (ok) s.done++; else { s.retried.add(w.id); s.queue.push(w); }
  if (!s.queue.length) finishSession(s);
  else { s.revealed = false; s.reversed = pickRev(); s.fresh = true; }
  render();
}
function finishSession(s) { s.finished = true; saveSnapshot(); }
function abortSession(s) {
  const n = s.correct + s.wrong;
  openModal(close => h('div', {},
    h('h3', {}, 'Sitzung abbrechen?'),
    h('p', { class: 'muted' }, n
      ? 'Deine ' + pl(n, 'bisherige Antwort', 'bisherigen Antworten') + ' ' + (n === 1 ? 'ist' : 'sind') + ' schon gespeichert. Die übrigen Wörter bleiben fällig.'
      : 'Es wurde noch nichts beantwortet, nichts geht verloren.'),
    h('div', { class: 'actions' },
      btn('Weiter üben', close),
      btn('Abbrechen', () => { close(); if (n > 0) { s.aborted = true; finishSession(s); render(); } else exit(); }, 'primary'))));
}

function viewIntro(v) {
  const s = v.s;
  return h('div', {},
    header('Üben'),
    h('div', { class: 'pad' },
      h('div', { class: 'card', style: 'text-align:center' },
        h('p', { class: 'muted small' }, s.note || 'Diese Runde'),
        h('div', { class: 'big' }, s.title),
        h('p', { class: 'muted' }, pl(s.total, 'Wort', 'Wörter') + (s.due ? ' · ' + s.due + ' fällig' : '')),
        h('p', { class: 'muted small' }, 'Richtung: ' + DIR_LABEL[db.meta.direction])),
      btn('Los geht’s', () => { s.intro = false; s.fresh = true; render(); }, 'primary wide'),
      v.reroll ? btn('Andere Kategorie würfeln', () => { v.s = v.reroll(s.catId); render(); }, 'wide') : null));
}

function viewPractice(v) {
  const s = v.s;
  if (s.finished) return viewSummary(s);
  if (s.intro) return viewIntro(v);
  const w = s.queue[0];
  const front = s.reversed ? w.native : w.foreign, back = s.reversed ? w.foreign : w.native;
  const cat = db.categories.find(c => c.id === w.categoryId);
  const flip = () => { if (!s.revealed) { s.revealed = true; render(); } };
  const end = h('button', { class: 'link', onclick: () => abortSession(s) }, 'Abbrechen');
  const fresh = s.fresh; s.fresh = false;
  const pct = s.done / s.total, from = fresh && s.prevPct != null ? s.prevPct : pct;
  s.prevPct = pct;
  return h('div', {},
    header('Üben', null, end),
    h('div', { class: 'pad' },
      h('div', { class: 'progress' }, h('div', { class: 'fill' + (from !== pct ? ' grow' : ''), style: '--from:' + from + ';--to:' + pct + ';transform:scaleX(' + pct + ')' })),
      h('p', { class: 'muted small' }, s.done + ' von ' + s.total + ' geschafft'),
      h('div', { class: 'flash' + (fresh ? ' fresh' : '') + (s.queue.length > 1 ? ' stack' : ''), onclick: flip },
        cat ? h('div', { class: 'cat' }, cat.name) : null,
        h('div', { class: 'front' }, front),
        s.revealed ? h('div', { class: 'back' }, back) : h('div', { class: 'hint' }, 'Tippen zum Umdrehen')),
      s.revealed
        ? h('div', { class: 'two' }, btn([icon('x', 18), 'Falsch'], () => answer(s, false), 'bad'), btn([icon('check', 18), 'Richtig'], () => answer(s, true), 'ok'))
        : btn('Umdrehen', flip, 'primary wide')));
}
function viewSummary(s) {
  const n = s.correct + s.wrong, pct = n ? Math.round(s.correct / n * 100) : 0;
  const saved = db.meta.lastBackup >= s.t0;
  return h('div', {},
    header(s.aborted ? 'Abgebrochen' : 'Fertig', null, null),
    h('div', { class: 'pad' },
      h('div', { class: 'card', style: 'text-align:center' }, h('h3', {}, pct + ' % beim ersten Versuch richtig'),
        h('p', { class: 'muted small' }, s.title),
        s.aborted ? h('p', { class: 'muted small' }, pl(s.queue.length, 'Wort', 'Wörter') + ' nicht mehr geschafft, bleiben fällig.') : null,
        h('div', { class: 'stat' }, h('span', { class: 'ok-t' }, icon('check', 22), s.correct), h('span', { class: 'bad-t' }, icon('x', 22), s.wrong))),
      h('div', { class: 'card' }, h('h2', {}, 'Backup'),
        h('p', { class: 'muted small' }, 'Auto-Sicherung im Gerät ist erledigt. Für eine Datei außerhalb der App brauchst du einen Tipp:'),
        saved ? h('p', { class: 'ok-t' }, icon('check'), 'Backup gespeichert') : btn('Backup in Dateien sichern', doBackup, 'primary wide')),
      btn('Fertig', exit, 'wide')));
}

/* ---- Mehr ---- */
function viewSettings() {
  const snap = readSnapshot(), last = db.meta.lastBackup;
  return h('div', {},
    header('Mehr'),
    h('div', { class: 'pad' },
      h('div', { class: 'card' }, h('h2', {}, 'Backup'),
        h('p', {}, last ? 'Letztes Backup: ' + fmtDate(last) : 'Noch kein Backup gespeichert.'),
        h('p', { class: 'muted small' }, 'Alle Daten liegen nur auf diesem Gerät. Das Backup enthält alles inklusive Lernstand.'),
        btn('Backup speichern', doBackup, 'primary wide', !db.folders.length),
        btn('Backup laden', loadBackup, 'wide')),
      h('div', { class: 'card' }, h('h2', {}, 'Auto-Sicherung im Gerät'),
        h('p', { class: 'muted small' }, 'Wird nach jeder Sitzung und vor Löschen/Laden angelegt. Hilft bei Versehen, ersetzt aber kein Backup außerhalb der App.'),
        h('p', {}, snap ? 'Stand: ' + fmtDate(snap.t) : 'Noch keine vorhanden.'),
        btn('Wiederherstellen', () => {
          if (!snap) return;
          if (!confirm('Aktuelle Daten durch den Stand vom ' + fmtDate(snap.t) + ' ersetzen?')) return;
          db = normalize(snap.data); save(); toast('Wiederhergestellt'); resetNav();
        }, 'wide', !snap)),
      h('div', { class: 'card' }, h('h2', {}, 'Lernfortschritt'),
        btn('Alles zurücksetzen', () => {
          if (!confirm('Lernstand aller Wörter zurücksetzen? Die Wörter bleiben.')) return;
          saveSnapshot();
          db.words.forEach(w => Object.assign(w, { reps: 0, ef: 2.5, interval: 0, due: 0, correct: 0, wrong: 0, last: 0 }));
          save(); toast('Zurückgesetzt'); render();
        }, 'wide danger', !db.words.length)),
      h('p', { class: 'muted small' }, pl(db.folders.length, 'Ordner', 'Ordner') + ' · ' + pl(db.categories.length, 'Kategorie', 'Kategorien') + ' · ' + pl(db.words.length, 'Wort', 'Wörter'))));
}
function loadBackup() {
  pickFile('.json,application/json', async file => {
    let data;
    try { data = normalize(JSON.parse(await readText(file))); } catch (e) { toast('Datei nicht lesbar'); return; }
    if (!data.folders.length) { toast('Keine Daten im Backup gefunden'); return; }
    if (!confirm('Backup enthält ' + pl(data.folders.length, 'Ordner', 'Ordner') + ' und ' + pl(data.words.length, 'Wort', 'Wörter') + '. Aktuelle Daten werden ersetzt (Auto-Sicherung wird vorher angelegt).')) return;
    saveSnapshot(); db = data; save(); toast('Backup geladen'); resetNav();
  });
}

const views = { home: viewHome, folder: viewFolder, category: viewCategory, practice: viewPractice, settings: viewSettings };
function render(keepScroll = true) {
  const y = window.scrollY;
  let el;
  try { el = views[view.name](view); }
  catch (err) { console.error(err); el = h('div', { class: 'pad' }, 'Fehler: ' + err.message); }
  $app.replaceChildren(el);
  window.scrollTo(0, keepScroll ? y : 0);
  if (!keepScroll) {
    el.classList.add('enter');
    el.querySelectorAll('.rowbtn,.card,.empty,.pad>.btn').forEach((n, i) => n.style.setProperty('--i', Math.min(i, 5)));
    setTimeout(() => el.classList.remove('enter'), 800);
  }
}

/* ============ Start ============ */
render(false);
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* egal */ }
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
})();
</script>
